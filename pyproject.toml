[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcontainer-service-manager"
version = "0.1.0"
description = "Development environment optimization: service orchestration, Docker caching, and workstation setup"
authors = [
    {name = "DevContainer Service Manager", email = "noreply@example.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "click>=8.0.0",
    "docker>=6.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "coverage>=7.0.0",
]
workstation = [
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
dcm = "devcontainer_services.cli:main"
dcm-cache = "devcontainer_services.caching.cli:main"
dcm-setup = "devcontainer_services.workstation.cli:main"

[project.urls]
Homepage = "https://github.com/devcontainer-service-manager/devcontainer-service-manager"
Repository = "https://github.com/devcontainer-service-manager/devcontainer-service-manager"
Issues = "https://github.com/devcontainer-service-manager/devcontainer-service-manager/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/devcontainer_services"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
