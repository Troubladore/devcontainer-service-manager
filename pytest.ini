[tool:pytest]
# Pytest configuration for DevContainer Service Manager

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring Docker
    unit: marks tests as unit tests
    contract: marks tests as contract fulfillment tests
    performance: marks tests as performance tests
    edge_case: marks tests as edge case tests

# Coverage settings
[coverage:run]
source = src/devcontainer_services
omit =
    */tests/*
    */conftest.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod

# Minimum coverage threshold
fail_under = 85

[coverage:html]
directory = htmlcov
